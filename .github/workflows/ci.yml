name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  check-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: End-to-end MCP smoke
        run: npx tsx scripts/smoke.ts
